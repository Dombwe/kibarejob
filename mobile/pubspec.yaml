name: kibarejob_mobile
description: KIBARE-JOB mobile candidate application.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  card_swiper: ^3.0.1
  dio: ^5.7.0
  file_picker: ^8.1.4
  flutter_image_compress: ^2.3.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_svg: ^2.2.2
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/kibare_job_logo.svg
    - assets/branding/google_g.svg
