# Suggested cron entries for production servers.
# Phase 1 remains free/mock, but resets keep counters clean for testing.

daily:
    command: 'bin/console subscription:reset-daily'
    schedule: '0 0 * * *'

monthly:
    command: 'bin/console subscription:reset-monthly'
    schedule: '0 0 1 * *'

matching_scores:
    command: 'bin/console matching:precompute-scores'
    schedule: '0 */6 * * *'

external_jobs_import:
    command: 'bin/console jobs:import-external --limit=50'
    schedule: '15 */4 * * *'

scheduled_commands:
    command: 'bin/console app:scheduled-commands:run'
    schedule: '*/5 * * * *'

documents_cleanup:
    command: 'bin/console document:cleanup'
    schedule: '30 2 * * *'
