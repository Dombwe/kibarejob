parameters:
    app.storage_base_url_default: '/storage'
    app.storage_path_default: 'var/storage'
    app.redis_cache_ttl_default: 120
    messenger_transport_dsn_default: 'doctrine://default?auto_setup=0'
    app.subscription_mode_default: 'mock'
    app.payment_method_default: 'none'
    app.public_url_default: 'http://localhost:8000'
    app.mail_from_default: 'emmanueldombwe@gmail.com'
    app.mail_from_name_default: 'KIBARE Job'
    app.contact_to_default: '%app.mail_from%'
    app.subscription_mode: '%env(default:app.subscription_mode_default:SUBSCRIPTION_MODE)%'
    app.payment_method: '%env(default:app.payment_method_default:PAYMENT_METHOD)%'
    app.redis_cache_ttl: '%env(int:default:app.redis_cache_ttl_default:REDIS_CACHE_TTL)%'
    app.public_url: '%env(default:app.public_url_default:APP_PUBLIC_URL)%'
    app.storage_base_url: '%env(default:app.storage_base_url_default:KIBARE_STORAGE_BASE_URL)%'
    app.storage_path: '%env(default:app.storage_path_default:KIBARE_STORAGE_PATH)%'
    app.mail_from: '%env(default:app.mail_from_default:MAIL_FROM)%'
    app.mail_from_name: '%env(default:app.mail_from_name_default:MAIL_FROM_NAME)%'
    app.contact_to: '%env(default:app.contact_to_default:CONTACT_TO)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'

    App\Service\FileUploadService:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $storageBaseUrl: '%app.storage_base_url%'
            $storagePath: '%app.storage_path%'

    App\Service\ChunkedUploadService:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $storagePath: '%app.storage_path%'

    App\Service\DocumentExtractorService:
        arguments:
            $tesseractBinary: null

    App\Controller\Api\DocumentController:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $storagePath: '%app.storage_path%'

    App\Controller\Api\AppConfigController:
        arguments:
            $storageBaseUrl: '%app.storage_base_url%'

    App\Controller\StorageController:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $storagePath: '%app.storage_path%'

    App\Controller\Api\CandidatureController:
        arguments:
            $mailFrom: '%app.mail_from%'

    App\Command\CleanupDocumentsCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $storagePath: '%app.storage_path%'

    App\Command\CheckStorageCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $storagePath: '%app.storage_path%'
            $storageBaseUrl: '%app.storage_base_url%'

    App\Service\SubscriptionService:
        arguments:
            $subscriptionMode: '%app.subscription_mode%'

    App\Service\PaymentService:
        arguments:
            $subscriptionMode: '%app.subscription_mode%'
            $paymentMethod: '%app.payment_method%'

    App\Service\AuthEmailService:
        arguments:
            $publicUrl: '%app.public_url%'
            $mailFrom: '%app.mail_from%'
            $mailFromName: '%app.mail_from_name%'

    App\Service\ContactEmailService:
        arguments:
            $mailFrom: '%app.mail_from%'
            $contactTo: '%app.contact_to%'

    App\Service\CvAdapterService:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $storagePath: '%app.storage_path%'

    App\MessageHandler\GenerateApplicationJobHandler:
        arguments:
            $mailFrom: '%app.mail_from%'
            $projectDir: '%kernel.project_dir%'
            $storagePath: '%app.storage_path%'

    App\Middleware\QuotaMiddleware:
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 20 }

    kibarejob.redis:
        class: Predis\Client
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments:
            - '%env(REDIS_URL)%'

    Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler:
        arguments:
            - '@kibarejob.redis'
            - { prefix: 'kjob:sess:', ttl: 86400 }

    App\Service\CacheService:
        arguments:
            $redis: '@kibarejob.redis'
            $defaultTtl: '%app.redis_cache_ttl%'

    App\Service\ScoreCacheService:
        arguments:
            $redis: '@kibarejob.redis'

    App\Middleware\RateLimiterMiddleware:
        arguments:
            $criticalLimiter: '@limiter.api_critical'
            $uploadLimiter: '@limiter.api_upload'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 40 }
